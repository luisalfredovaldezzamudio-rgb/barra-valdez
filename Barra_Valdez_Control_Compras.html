<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barra Valdez | Control de Compras</title><style>
:root{font-family:system-ui;background:#f7f8f2;color:#283521}body{margin:0;max-width:850px;margin:auto}header{background:#65764b;color:white;padding:22px;border-radius:0 0 20px 20px}h1{margin:0;font-size:25px}small{opacity:.8}main{padding:15px}.panel{background:white;border:1px solid #dce2d5;border-radius:15px;padding:16px;margin:12px 0}input,select,button{padding:11px;border:1px solid #bdc7b5;border-radius:9px;font-size:15px;max-width:100%;box-sizing:border-box}button{background:#65764b;color:white;border:0;cursor:pointer}button.secondary{background:#e9eee2;color:#34452b}.tabs{display:flex;gap:6px;overflow:auto}.tabs button{white-space:nowrap}.line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}.line:last-child{border:0}.muted{color:#697466;font-size:13px}.pill{background:#e9eee2;border-radius:20px;padding:4px 9px;font-size:12px}label{display:block;margin:9px 0}input[type=number]{width:90px}#content{min-height:250px}</style>
<header><h1>☕ BARRA VALDEZ</h1><small>CAFÉ DE ALTURA · Control de Compras</small></header><main><div class="panel"><label>Vista de usuario (simulación, sin inicio de sesión real) <select id="role"><option value="admin">Administrador</option><option value="general">Encargada general</option><option value="cocina">Encargada de cocina</option><option value="barra">Encargado de barra</option></select></label><div class="muted">Compras: martes, jueves y sábado · Pedidos 17:00 · Autorización 18:00 · Cierre 19:00</div></div><nav class="tabs" id="tabs"></nav><div id="content"></div><div class="muted">Prototipo local: los cambios se guardan solo en este navegador. No sincroniza teléfonos ni envía notificaciones.</div></main>
<script>
const stores=["Sam's Club","Costco","Mercado","Bodega Aurrera","Tiendas 3B","Otros"], initial={products:[{id:1,name:"Leche entera",area:"barra",unit:"L",stock:12,min:8,store:"Costco",price:28},{id:2,name:"Vasos",area:"barra",unit:"pzas",stock:100,min:60,store:"Sam's Club",price:1.5},{id:3,name:"Jitomate",area:"cocina",unit:"kg",stock:3,min:4,store:"Mercado",price:30}],requests:[],history:[]};let data=JSON.parse(localStorage.getItem("bv_demo")||"null")||initial,tab="Inventario";const role=document.getElementById("role"),content=document.getElementById("content"),tabs=document.getElementById("tabs");function save(){localStorage.setItem("bv_demo",JSON.stringify(data));render()}function allowed(p){return ["admin","general"].includes(role.value)||p.area===role.value}function h(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function money(n){return Number(n||0).toLocaleString("es-MX",{style:"currency",currency:"MXN"})}function stamp(){return new Date().toLocaleString("es-MX")}function section(s){return '<div class="panel">'+s+'</div>'}function options(arr,selected){return arr.map(x=>`<option ${x===selected?"selected":""}>${h(x)}</option>`).join("")}function render(){const ts=["Inventario","Solicitudes","Compras","Historial"];tabs.innerHTML=ts.map(t=>`<button class="${tab===t?"":"secondary"}" onclick="tab='${t}';render()">${t}</button>`).join("");if(tab==="Inventario"){content.innerHTML=section('<h3>Existencias</h3>'+data.products.filter(allowed).map(p=>`<div class="line"><div><b>${h(p.name)}</b> <span class="pill">${h(p.area)}</span><div class="muted">${p.stock} ${h(p.unit)} · mínimo ${p.min} · ${h(p.store)} ${p.stock<=p.min?"⚠️ Reponer":""}</div></div><div><input type="number" step="0.01" id="stock${p.id}" value="${p.stock}"><button onclick="setStock(${p.id})">Actualizar</button></div></div>`).join('')+'<h3>Agregar insumo</h3><form onsubmit="addProduct(event)"><input required name="name" placeholder="Producto"><select name="area">'+options(["barra","cocina","general"],role.value)+'</select><input required name="unit" placeholder="Unidad (L, kg, pzas)"><input required type="number" step="0.01" name="stock" placeholder="Existencia"><input required type="number" step="0.01" name="min" placeholder="Mínimo"><select name="store">'+options(stores)+'</select><input type="number" step="0.01" name="price" placeholder="Precio unitario"><button>Guardar producto</button></form>')}else if(tab==="Solicitudes"){content.innerHTML=section('<h3>Nueva solicitud</h3><form onsubmit="addRequest(event)"><select name="product">'+data.products.filter(allowed).map(p=>`<option value="${p.id}">${h(p.name)}</option>`).join('')+'</select><input required type="number" min=".01" step=".01" name="qty" placeholder="Cantidad"><select name="priority"><option>Normal</option><option>Urgente</option></select><input name="note" placeholder="Observaciones"><button>Agregar solicitud</button></form>')+section('<h3>Solicitudes registradas</h3>'+(data.requests.map(r=>{const p=data.products.find(p=>p.id===r.product);return `<div class="line"><div><b>${h(p?.name||"Producto")}</b> · ${r.qty} ${h(p?.unit||"")} <span class="pill">${h(r.priority)}</span><div class="muted">${h(r.area)} · ${h(r.status)} · ${h(r.date)} · ${h(r.note)}</div></div><div>${role.value==="general"&&r.status==="Pendiente"?`<button onclick="approve(${r.id})">Autorizar</button>`:""} ${role.value==="admin"&&r.status==="Pendiente"?"<span class=pill>Visible sin aprobar</span>":""}</div></div>`}).join('')||'<p>Sin solicitudes todavía.</p>'))}else if(tab==="Compras"){const approved=data.requests.filter(r=>r.status==="Autorizado");content.innerHTML=stores.map(store=>{const rows=approved.filter(r=>data.products.find(p=>p.id===r.product)?.store===store);return section(`<h3>${h(store)}</h3>`+(rows.map(r=>{const p=data.products.find(p=>p.id===r.product);return `<div class="line"><div>${h(p.name)} · ${r.qty} ${h(p.unit)}<div class="muted">Estimado ${money(r.qty*p.price)} · ${h(r.priority)}</div></div>${role.value==="admin"?`<button onclick="purchase(${r.id})">Recibido</button>`:""}</div>`}).join('')||'<div class="muted">Sin compras aprobadas</div>')+`<b>Subtotal estimado: ${money(rows.reduce((a,r)=>a+r.qty*data.products.find(p=>p.id===r.product).price,0))}</b>`)}).join('')}else{content.innerHTML=section('<h3>Historial de movimientos</h3>'+(data.history.slice().reverse().map(x=>`<div class="line"><span>${h(x.text)}</span><small>${h(x.date)}</small></div>`).join('')||'<p>Sin movimientos todavía.</p>'))}}function setStock(id){const p=data.products.find(p=>p.id===id);if(!allowed(p))return;const n=Number(document.getElementById("stock"+id).value);if(!Number.isFinite(n)||n<0)return alert("Cantidad inválida");data.history.push({text:`${role.value}: ${p.name}, de ${p.stock} a ${n} ${p.unit}`,date:stamp()});p.stock=n;save()}function addProduct(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!["admin","general"].includes(role.value)&&f.area!==role.value)return alert("Área no permitida");data.products.push({...f,id:Date.now(),stock:Number(f.stock),min:Number(f.min),price:Number(f.price||0)});save()}function addRequest(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),p=data.products.find(p=>p.id===Number(f.product));if(!p||!allowed(p))return;data.requests.push({id:Date.now(),product:p.id,qty:Number(f.qty),priority:f.priority,note:f.note,area:role.value,status:role.value==="general"?"Autorizado":"Pendiente",date:stamp()});save()}function approve(id){if(role.value!=="general")return;const r=data.requests.find(r=>r.id===id);if(r)r.status="Autorizado";save()}function purchase(id){if(role.value!=="admin")return;const r=data.requests.find(r=>r.id===id),p=data.products.find(p=>p.id===r.product);const actual=prompt("Importe total real pagado (MXN):",String((r.qty*p.price).toFixed(2)));if(actual===null)return;const cost=Number(actual);if(!Number.isFinite(cost)||cost<0)return alert("Importe inválido");p.stock+=r.qty;r.status="Recibido";data.history.push({text:`Compra recibida: ${p.name}, +${r.qty} ${p.unit}, ${money(cost)}, ${p.store}`,date:stamp()});save()}role.onchange=render;render();
</script></html>
